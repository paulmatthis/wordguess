name: Build Android app
on:
  push:
    branches: [main]
    paths: ['docs/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSION: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.p12"
          KEYSTORE_FILE="$RUNNER_TEMP/key.p12" android/build.sh
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" android/build/wordguess.apk \
            --latest --title "Word Guess 1.${{ github.run_number }}" \
            --notes "Download wordguess.apk on your Android phone and open it to install."
